# The authoritative merge gate for the GO verdict (#452): branch protection
# requires the `verdict-gate` commit status this workflow posts.
#
# Why a second workflow: verdict-check.yml runs on `pull_request_review`, and a
# review run loads its workflow file from the PR's merge ref — a PR can rewrite
# that job's run step to pass without checking anything (PR #571 review, P1).
# This file runs on `workflow_run`, which GitHub always loads from the DEFAULT
# branch, and it checks out only the default branch's scripts/verdict_check.py.
# No file the PR touches is executed here, and the PR's code is never checked out.
#
# verdict-check.yml is now the trigger: every review it sees completes a run,
# and that completion wakes this gate. The gate re-derives the verdict from the
# GitHub API and posts it on the PR's CURRENT head (statuses are latest-wins per
# context, so a later GO clears an earlier failure without a re-run). A push
# leaves the new head with no status, which blocks until a fresh GO.
#
# Identity: branch protection matches a required check by name, and a fork PR
# can add its own workflow with a job named `verdict-gate`. Pin the required
# check's expected source to a GitHub App that only this workflow can mint a token
# for — repository secrets never reach a fork PR's workflows. Set the app's client
# ID as variable VERDICT_GATE_CLIENT_ID and its private key as secret
# VERDICT_GATE_PRIVATE_KEY (docs/ops.md#merge-gate). Without them the gate posts
# as github-actions and says so: still a trusted evaluation, but a forgeable name.
name: verdict-gate

on:
  workflow_run:
    workflows: [verdict-check]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-evaluate
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  # One evaluation per head at a time; a queued one re-reads every review anyway.
  group: verdict-gate-${{ github.event.workflow_run.head_sha || inputs.pr }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # github.sha on workflow_run is the default branch's head: the checker that
      # gates a PR is the one already merged, never the PR's copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; same pin as validate.yml)
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/verdict_check.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - id: app
        if: vars.VERDICT_GATE_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 (Node 24)
        with:
          client-id: ${{ vars.VERDICT_GATE_CLIENT_ID }}
          private-key: ${{ secrets.VERDICT_GATE_PRIVATE_KEY }}
          permission-pull-requests: read
          permission-statuses: write
      - name: Post the verdict-gate status on the PR head
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          GATE_IDENTITY: ${{ steps.app.outcome == 'success' && 'app' || 'github-actions' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GATE_IDENTITY" != app ]; then
            echo "::warning::verdict-gate posts as github-actions: set VERDICT_GATE_CLIENT_ID and VERDICT_GATE_PRIVATE_KEY so a PR job named verdict-gate cannot stand in for it (docs/ops.md#merge-gate)"
          fi
          if [ -n "$RUN_PR" ]; then
            python3 scripts/verdict_check.py --post-status --pr "$RUN_PR"
          else
            python3 scripts/verdict_check.py --post-status --head-sha "$RUN_HEAD_SHA"
          fi
