# Correctness classes only. The default rule set is ~99 hits of style
# (PLW1510 subprocess.check, …) — enabling those is a policy change, not a
# catalog-gate hole (issue #214).
#
#   E9 / F63 / F7 / F82   syntax errors and undefined names
#   F401 / F841           unused imports and locals: dead code that hides a
#                         dropped call (the "mutant left the suite green" shape)
#   B023                  a closure reading a loop variable late — a test that
#                         builds per-iteration lambdas can silently assert on
#                         the LAST iteration only
#   B905                  zip() without strict= truncates silently: a fixture
#                         table one row short passes instead of failing
#   PLE                   pylint errors (0 hits today; kept so none arrive)
target-version = "py313"

[lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841", "B023", "B905", "PLE"]
