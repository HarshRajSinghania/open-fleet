name: publish-dist

# #518: copy installers (the `skills` CLI and anything that copies one skill directory) sever a
# mission's bare-name lookups, because playbooks/ and runtime/ live two levels above the skill.
# `scripts/bundle.py` builds a self-contained tree with every referenced doc vendored under each
# mission, and CI has checked that build for months — but nothing ever published it, so there
# was no target to point an installer at. On every `v*` tag this job builds that tree and pushes
# it to the `dist` branch as a single orphan commit (history is the tag's, not the branch's).
# `docs/install.md` names the branch. Uses only git and the runner's token.
#
# Only the newest release tag is ever published: a manual run names an existing `v*` tag
# and checks THAT out, and the guard step refuses anything else — a branch, a lightweight
# tag, a tag off main, or an older release than the newest one on main — so a dispatch can
# neither replace the released bundle with unreleased content nor downgrade `dist` to an
# older catalog (PR #509 review). Re-publishing an older release is a deliberate act done
# by hand, never by this job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing v* release tag to publish the bundle of (for example v0.7.0); never a branch"
        required: true
        type: string

permissions:
  contents: write

# One publish at a time, in order, never cancelled mid-push: two tag runs cannot interleave
# their guard and their force-push (PR #509 review). The newest-tag rule is re-checked against
# freshly fetched refs, and against what `dist` currently holds, right before the push.
concurrency:
  group: publish-dist
  cancel-in-progress: false

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Only the release maintainer publishes
        # 2026-10-23 review, P2-23: docs/ops.md "Maintainer roles" says only the repository owner
        # authorizes a cut and write access alone does not delegate it, yet any writer's `v*` tag
        # push (or dispatch) ran this job. The account that pushed or dispatched AND the one that
        # started this attempt (a re-run's triggering_actor) must both be the owner. This binds
        # the reviewed copy of this file only: a writer who tags a commit whose own copy drops the
        # step is stopped by the tag ruleset in docs/ops.md#publishing-releases, not by this step.
        env:
          RELEASE_MAINTAINER: ${{ github.repository_owner }}
          RUN_ACTOR: ${{ github.actor }}
          RUN_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_MAINTAINER" ] || [ "$RUN_ACTOR" != "$RELEASE_MAINTAINER" ] \
             || [ "$RUN_TRIGGERING_ACTOR" != "$RELEASE_MAINTAINER" ]; then
            echo "::error::only the release maintainer '$RELEASE_MAINTAINER' publishes; this run is by '$RUN_ACTOR' (attempt by '$RUN_TRIGGERING_ACTOR'), see docs/ops.md#publishing-releases"
            exit 1
          fi
          echo "release maintainer '$RELEASE_MAINTAINER' started this run"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; same pin as validate.yml)
        with:
          # A dispatch checks out the named tag, never the branch the run was started from.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0  # bundle.py resolves references against the full tree; provenance names the commit
          # No write token in the tree bundle.py runs in (W6-07): the re-fetches below are
          # anonymous (a public repository), and the push names its token in the URL.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)

      - name: Refuse anything but the newest annotated release tag on main
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::'$TAG' is not a v* release tag; the dist branch is built from tags only"; exit 1 ;;
          esac
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"   # docs/ops.md: lightweight tags are refused
          cut="$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$cut"                # the checkout IS the tag's commit
          git merge-base --is-ancestor "$cut" origin/main      # a tag off main is not a release
          # dist tracks the newest release only: an older tag would force-push a downgraded
          # catalog over it (PR #509 review). Version order, not date order.
          newest="$(git tag --list 'v[0-9]*' --merged origin/main --sort=-v:refname | head -n 1)"
          if [ "$TAG" != "$newest" ]; then
            echo "::error::'$TAG' is not the newest release on main ($newest); dist is never downgraded by this job"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build the self-contained tree
        run: |
          set -euo pipefail
          python3 scripts/bundle.py --check
          python3 scripts/bundle.py --out "$RUNNER_TEMP/dist"
          test -d "$RUNNER_TEMP/dist/skills"
          cp LICENSE THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/dist/"
          printf 'Built by scripts/bundle.py from %s at %s.\nEvery mission under skills/ carries its playbooks and runtime docs under references/.\nSource: https://github.com/%s\n' \
            "${TAG}" "$(git rev-parse HEAD)" "${GITHUB_REPOSITORY}" > "$RUNNER_TEMP/dist/DIST-PROVENANCE.txt"

      - name: Publish to the dist branch
        # An orphan commit per publish: the branch is a build artifact, never a history to merge.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$(git rev-parse HEAD)"
          # Re-run the newest-tag rule on refs fetched NOW: a run that passed the guard before
          # a newer tag landed must not publish after the newer tag's run did.
          git fetch -q origin 'refs/tags/*:refs/tags/*' main
          newest="$(git tag --list 'v[0-9]*' --merged origin/main --sort=-v:refname | head -n 1)"
          if [ "$TAG" != "$newest" ]; then
            echo "::error::'$TAG' is no longer the newest release on main ($newest); not publishing"
            exit 1
          fi
          # And never push over a newer bundle: the provenance file on dist names what is there.
          if git fetch -q origin dist 2>/dev/null; then
            published="$(git show FETCH_HEAD:DIST-PROVENANCE.txt 2>/dev/null \
              | sed -n 's|^Built by scripts/bundle.py from \(v[0-9][^ ]*\) at .*|\1|p' | head -n 1)"
            if [ -n "$published" ] \
               && [ "$(printf '%s\n%s\n' "$published" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
              echo "::error::dist already holds $published, newer than '$TAG'; not downgrading"
              exit 1
            fi
          fi
          cd "$RUNNER_TEMP/dist"
          git init -q -b dist
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "dist: bundle of ${TAG} (${src})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist:dist
          {
            echo "## publish-dist"
            echo ""
            echo "- branch \`dist\` now holds the bundle of \`${TAG}\` (\`${src}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
